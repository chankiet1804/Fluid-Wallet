name: fluid_wallet
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Token and chain icons ship as SVG. Pinned exactly, like every other
  # dependency here.
  flutter_svg: 2.3.0

  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Token balances are BigInt of smallest units; display goes BigInt -> Decimal
  # -> String and never through double. See the plan overview §4.1.
  decimal: ^3.2.4
  # Alchemy (balances) and CoinGecko (prices).
  dio: ^5.9.0
  # Token and chain icons in assets/config/chains-default.json are remote PNG
  # URLs. Bundled SVGs still win when a symbol has one.
  cached_network_image: ^3.4.1

  # Anything on the path of the mnemonic or a derived key is pinned exactly, not
  # with a caret: blockchain_utils' publisher is unverified and web3dart is a
  # hand-over from an archived repo. Read the changelog diff before any bump.
  # blockchain_utils: BIP39 mnemonic, BIP44 derivation, secp256k1, EIP-55.
  # web3dart: signing and contract calls (Phase 4+; unused for now).
  flutter_secure_storage: 10.3.1
  blockchain_utils: 7.1.0
  web3dart: 3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  # Build-time only, never shipped in the app. They generate the native icon
  # and splash resources from assets/branding/, which tool/generate_branding_assets.dart
  # rasterises out of assets/icons/brand/fluid.svg.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/app_icon.png
  # Android adaptive icon: white plate, glyph inside the 66% safe zone.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png

# Regenerate with: dart run flutter_native_splash:create
# White background on both platforms — same value as the qrSurface token the
# in-app logo sits on. Deliberately not following the dark scheme: the brand
# glyph is blue and needs a light surface.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/splash_icon.png
  android_12:
    color: "#FFFFFF"
    image: assets/branding/splash_icon_android12.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Branded SVGs from github.com/0xa3k5/web3icons (MIT, see assets/icons/LICENCE).
  assets:
    - assets/icons/brand/
    - assets/icons/networks/
    - assets/icons/tokens/
    # chains-default.json is the single source of truth for which chains exist
    # and which tokens live on each. See the plan overview §4.7 before editing
    # it — decimals differ per chain and a bad address loses funds.
    - assets/config/

  # Static weights are bundled deliberately instead of variable fonts or the
  # google_fonts package: no runtime network fetch, explicit weight mapping.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Address and tx hash only — disambiguates 0/O and 1/l/I.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
